# PEP 517/518 build configuration for editable/package installations.
[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

# Core package metadata used by pip/PyPI tooling.
[project]
name = "design-research-agents"
version = "0.2.0"
description = "A flexible, modular framework for researching AI agents that design"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "design-research-agents contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "bashkit>=0.1.4",
    "jsonschema>=4.23",
    "mcp>=1.6",
    "openai>=1.40",
    "pyyaml>=6.0"
]

[project.scripts]
dra = "design_research_agents.cli:main"

# Batteries-included contributor dependencies.
[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.0",
    "ruff>=0.6.0",
    "sphinx>=7.4",
    "sphinx-rtd-theme>=2.0",
]
local = [
    "huggingface-hub>=0.24",
    "llama-cpp-python[server]>=0.2.90",
    "mlx-lm>=0.14",
    "transformers>=4.44",
    "jsonschema>=4.21",
]

# Use src-layout packaging.
[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

# Discover packages under src/.
[tool.setuptools.packages.find]
where = ["src"]

# Ship marker file for typed package consumers.
[tool.setuptools.package-data]
design_research_agents = ["py.typed", "schemas/*.json", "prompts/*.md"]

# Pytest defaults for local + CI test runs.
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "examples_full: deterministic end-to-end example execution suite",
    "examples_smoke: small deterministic example smoke checks for main CI",
    "contract: contract-focused behavior tests for runtime boundaries",
]

# Ruff settings for lint/format targets.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D", "C90"]
[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D"]

# Strict-ish mypy baseline for framework code.
[tool.mypy]
packages = ["design_research_agents"]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

# Third-party stubs may be missing locally; keep checks stable.
[[tool.mypy.overrides]]
module = [
    "jsonschema",
    "jsonschema.*",
    "mlx_lm",
    "mlx_lm.*",
    "openai",
    "openai.*",
    "bashkit",
    "bashkit.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "yaml",
]
ignore_missing_imports = true
