# PEP 517/518 build configuration for editable/package installations.
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# Core package metadata used by pip/PyPI tooling.
[project]
name = "design-research-agents"
version = "0.2.0"
description = "A flexible, modular framework for researching engineering design AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The Design Research Collective" }]
maintainers = [{ name = "Christopher C. McComb", email = "ccm@cmu.edu" }]

keywords = ["agents", "llm", "mcp", "design", "research", "orchestration"]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

# Core deps: includes a "works everywhere" default backend (OpenAI).
dependencies = [
  "bashkit>=0.1.4",
  "jsonschema>=4.23,<5",
  "openai>=1.40,<2",
]

[project.urls]
Homepage = "https://cmudrc.github.io/design-research-agents/"
Documentation = "https://cmudrc.github.io/design-research-agents/"
Repository = "https://github.com/cmudrc/design-research-agents"
Issues = "https://github.com/cmudrc/design-research-agents/issues"

# Optional deps / extras.
[project.optional-dependencies]

# Contributor batteries.
dev = [
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<5",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=7.0,<8",
  "ruff>=0.6.0,<1",
  "build>=1.2,<2",
  "sphinx>=7.4,<9",
  "sphinxcontrib-mermaid>=1.0,<2",
  "sphinx-rtd-theme>=2.0,<4",
  "twine>=5,<7",
]

# Shared HF utilities (handy for multiple backends)
hf = ["huggingface-hub>=0.24"]

# Hosted provider SDKs
anthropic = ["anthropic>=0.40,<1"]

gemini = ["google-genai>=1.0,<2"]

groq = ["groq>=1.0,<2"]

# Local backends
llama_cpp = [
  "huggingface-hub>=0.24",
  "llama-cpp-python[server]>=0.2.90",
]

mlx = [
  "mlx-lm>=0.14; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

transformers = [
  "huggingface-hub>=0.24",
  "torch>=2.4,<3",
  "transformers>=4.44",
]

# Server-focused runtimes: gate to Linux so bundles don't explode elsewhere.
vllm = [
  "vllm>=0.6,<1; platform_system == 'Linux' and python_version < '3.14'",
]

sglang = [
  "sglang>=0.4,<1; platform_system == 'Linux' and python_version < '3.14'",
]

# Convenience bundles
# - "local" = all local backends that make sense on the current platform
# - "full"  = local + server backends (Linux-only pieces auto-skip elsewhere)
local = [
  "huggingface-hub>=0.24",
  "llama-cpp-python[server]>=0.2.90",
  "mlx-lm>=0.14; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "torch>=2.4,<3",
  "transformers>=4.44",
]

full = [
  "huggingface-hub>=0.24",
  "llama-cpp-python[server]>=0.2.90",
  "mlx-lm>=0.14; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "torch>=2.4,<3",
  "transformers>=4.44",
  "vllm>=0.6,<1; platform_system == 'Linux' and python_version < '3.14'",
  "sglang>=0.4,<1; platform_system == 'Linux' and python_version < '3.14'",
]

# Use src-layout packaging.
[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

# Discover packages under src/.
[tool.setuptools.packages.find]
where = ["src"]

# Ship marker file for typed package consumers + runtime assets.
[tool.setuptools.package-data]
design_research_agents = ["py.typed", "_schemas/*.schema.json", "_prompts/*.md"]

# Pytest defaults for local + CI test runs.
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "examples_full: deterministic end-to-end example execution suite",
  "examples_smoke: small deterministic example smoke checks for main CI",
  "contract: contract-focused behavior tests for runtime boundaries",
]

# Ruff settings for lint/format targets.
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D"]
"examples/**/*.py" = ["E501", "D301"]

# Strict-ish mypy baseline for framework code.
[tool.mypy]
packages = ["design_research_agents"]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

# Third-party stubs may be missing locally; keep checks stable.
[[tool.mypy.overrides]]
module = [
  "jsonschema",
  "jsonschema.*",
  "mcp",
  "mcp.*",
  "anthropic",
  "anthropic.*",
  "google",
  "google.*",
  "groq",
  "groq.*",
  "mlx_lm",
  "mlx_lm.*",
  "openai",
  "openai.*",
  "bashkit",
  "bashkit.*",
  "torch",
  "torch.*",
  "transformers",
  "transformers.*",
]
ignore_missing_imports = true
