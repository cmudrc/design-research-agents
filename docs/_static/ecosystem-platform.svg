<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="ecosystem-title ecosystem-desc">
  <!-- Canonical source: cmudrc/design-research; shared contract: ecosystem-topology-v1. -->
  <title id="ecosystem-title">Two views of the design-research ecosystem</title>
  <desc id="ecosystem-desc">The control topology shows Experiments coordinating peer Problems and Agents inputs and defining the handoff to Analysis. The runtime view shows Problems and Agents producing an Experiments artifact set, which flows to Analysis and protocol feedback.</desc>
  <defs>
    <style>
      .panel { fill:#F7F9F9; stroke:#B8C1C2; stroke-width:2; }
      .section-title { font-family:Inter,Arial,sans-serif; font-size:28px; font-weight:700; fill:#172124; }
      .section-note { font-family:Inter,Arial,sans-serif; font-size:16px; font-weight:500; fill:#455357; }
      .box-title { font-family:Inter,Arial,sans-serif; font-size:24px; font-weight:700; fill:#111719; }
      .box-note { font-family:Inter,Arial,sans-serif; font-size:15px; font-weight:500; fill:#172124; }
      .flow-note { font-family:Inter,Arial,sans-serif; font-size:14px; font-weight:600; fill:#455357; paint-order:stroke; stroke:#F7F9F9; stroke-width:6px; stroke-linejoin:round; }
      .link { stroke:#667477; stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .feedback { stroke:#4D8687; stroke-width:4; stroke-dasharray:10 9; fill:none; stroke-linecap:round; }
      .box { filter:drop-shadow(0 5px 10px rgba(0,0,0,0.12)); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#667477"/>
    </marker>
    <marker id="feedback-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#4D8687"/>
    </marker>
  </defs>

  <rect class="panel" x="25" y="20" width="1450" height="425" rx="28"/>
  <text class="section-title" x="60" y="68">Control topology</text>
  <text class="section-note" x="60" y="96">Responsibility and coordination: Problems and Agents are peer study inputs.</text>

  <path class="link" d="M610 230 C560 260 430 270 280 300" marker-end="url(#arrow)"/>
  <path class="link" d="M750 230 L750 300" marker-end="url(#arrow)"/>
  <path class="link" d="M890 230 C970 258 1080 270 1220 300" marker-end="url(#arrow)"/>
  <text class="flow-note" x="485" y="274" text-anchor="middle">coordinates study inputs and runs</text>
  <text class="flow-note" x="1085" y="274" text-anchor="middle">defines the artifact handoff</text>

  <g class="box">
    <rect x="460" y="125" width="580" height="105" rx="26" fill="#57B7BA" stroke="#318E92" stroke-width="3"/>
    <text class="box-title" x="750" y="170" text-anchor="middle">Experiments</text>
    <text class="box-note" x="750" y="201" text-anchor="middle">study design, execution control, replication, and export</text>
  </g>
  <g class="box">
    <rect x="100" y="300" width="360" height="100" rx="24" fill="#EA8534" stroke="#B96320" stroke-width="3"/>
    <text class="box-title" x="280" y="344" text-anchor="middle">Problems</text>
    <text class="box-note" x="280" y="374" text-anchor="middle">tasks, prompts, grammars, evaluators</text>
  </g>
  <g class="box">
    <rect x="570" y="300" width="360" height="100" rx="24" fill="#DF5127" stroke="#AD3617" stroke-width="3"/>
    <text class="box-title" x="750" y="344" text-anchor="middle">Agents</text>
    <text class="box-note" x="750" y="374" text-anchor="middle">participants, workflows, tools, traces</text>
  </g>
  <g class="box">
    <rect x="1040" y="300" width="360" height="100" rx="24" fill="#4D8687" stroke="#2E6263" stroke-width="3"/>
    <text class="box-title" x="1220" y="344" text-anchor="middle">Analysis</text>
    <text class="box-note" x="1220" y="374" text-anchor="middle">validation, transformation, inference</text>
  </g>

  <rect class="panel" x="25" y="470" width="1450" height="265" rx="28"/>
  <text class="section-title" x="60" y="518">Runtime and data flow</text>
  <text class="section-note" x="60" y="546">What moves during a study: inputs become versioned artifacts, evidence, and protocol feedback.</text>

  <path class="link" d="M360 605 C450 605 500 620 560 635" marker-end="url(#arrow)"/>
  <path class="link" d="M360 685 C450 685 500 675 560 665" marker-end="url(#arrow)"/>
  <path class="link" d="M920 650 L1020 650" marker-end="url(#arrow)"/>
  <path class="link" d="M1240 650 L1300 650" marker-end="url(#arrow)"/>
  <path class="feedback" d="M1375 600 C1450 535 1450 240 1040 178" marker-end="url(#feedback-arrow)"/>
  <text class="flow-note" x="1425" y="538" text-anchor="end">evidence refines the next protocol</text>

  <g class="box">
    <rect x="60" y="570" width="300" height="70" rx="20" fill="#EA8534" stroke="#B96320" stroke-width="3"/>
    <text class="box-title" x="210" y="598" text-anchor="middle">Problems</text>
    <text class="box-note" x="210" y="624" text-anchor="middle">tasks and evaluators</text>
  </g>
  <g class="box">
    <rect x="60" y="650" width="300" height="70" rx="20" fill="#DF5127" stroke="#AD3617" stroke-width="3"/>
    <text class="box-title" x="210" y="678" text-anchor="middle">Agents</text>
    <text class="box-note" x="210" y="704" text-anchor="middle">executions and traces</text>
  </g>
  <g class="box">
    <rect x="560" y="600" width="360" height="100" rx="22" fill="#57B7BA" stroke="#318E92" stroke-width="3"/>
    <text class="box-title" x="740" y="640" text-anchor="middle">Experiments artifact set</text>
    <text class="box-note" x="740" y="672" text-anchor="middle">manifest schema 0.2.0</text>
  </g>
  <g class="box">
    <rect x="1020" y="600" width="220" height="100" rx="22" fill="#4D8687" stroke="#2E6263" stroke-width="3"/>
    <text class="box-title" x="1130" y="640" text-anchor="middle">Analysis</text>
    <text class="box-note" x="1130" y="672" text-anchor="middle">evidence</text>
  </g>
  <g class="box">
    <rect x="1300" y="600" width="150" height="100" rx="22" fill="#FFFFFF" stroke="#4D8687" stroke-width="3"/>
    <text class="box-title" x="1375" y="640" text-anchor="middle">Feedback</text>
    <text class="box-note" x="1375" y="672" text-anchor="middle">refine protocol</text>
  </g>
</svg>
