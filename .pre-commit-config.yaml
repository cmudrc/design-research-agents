# Pre-commit configuration
# - Runs formatting/linting/type-checking automatically on `git commit` (after `pre-commit install`).
# - Runs tests on `git push` (after `pre-commit install --hook-type pre-push`).
# - Run everything manually: `pre-commit run --all-files`
# - Update pinned hook versions: `pre-commit autoupdate`

default_stages: [pre-commit]

repos:
  # Delegate quality checks to Make targets so local hooks and CI stay aligned.
  - repo: local
    hooks:
      - id: make-lint
        name: make lint
        entry: make lint
        language: system
        pass_filenames: false

      - id: make-format-check
        name: make format-check
        entry: make format-check
        language: system
        pass_filenames: false

      - id: make-typecheck
        name: make typecheck
        entry: make typecheck
        language: system
        pass_filenames: false

      - id: make-test
        name: make test
        entry: make test
        language: system
        pass_filenames: false
        stages: [pre-push]
