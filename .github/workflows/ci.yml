name: CI

# Run quality gates for main branch updates and all pull requests.
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

jobs:
  latest:
    # Primary quality gates on broadly current dependencies.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Speed up installs by caching pip downloads between runs.
          cache: pip

      - name: Install dependencies
        run: make dev

      - name: Run checks
        # Lint/format/type checks, fast unit suite, coverage, and examples smoke.
        run: make ci

  lowest:
    # Validate that minimum direct dependency bounds are viable.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv --python 3.12 .venv

      - name: Install lowest direct dependencies
        run: uv pip install --python .venv/bin/python --resolution lowest-direct -e ".[dev]" "pytest-asyncio>=0.24,<1"

      - name: Run tests
        run: make test

  locked:
    # Frozen reproducible installs from uv.lock, pinned to release Python patch.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            repro-python: "3.12.12"
            repro-extras: "dev full"
          - os: macos-latest
            repro-python: "3.12"
            repro-extras: "dev local"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.repro-python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Reproducible frozen install
        run: make repro REPRO_PYTHON="${{ matrix.repro-python }}" REPRO_EXTRAS="${{ matrix.repro-extras }}"

      - name: Run tests
        run: make test

  coverage-badge:
    # Keep a coverage badge on main in sync with the stable unit-suite baseline.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [latest, lowest, locked]
    concurrency:
      group: coverage-badge-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the named branch to avoid detached-HEAD push issues.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: make dev

      - name: Generate coverage report
        run: make coverage

      - name: Generate coverage badge
        run: python scripts/generate_coverage_badge.py

      - name: Generate deterministic example metrics and badges
        run: make examples-metrics

      - name: Commit and push badge if changed
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if ! git status --porcelain -- .github/badges/coverage.svg .github/badges/examples-passing.svg .github/badges/examples-api-coverage.svg | grep -q .; then
            echo "Badges unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg .github/badges/examples-passing.svg .github/badges/examples-api-coverage.svg
          git commit -m "chore: update coverage and examples badges [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"
